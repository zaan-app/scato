[tox]
envlist = py38, py39, py310, py311, py312, py313
isolated_build = true
skip_missing_interpreters = true

[testenv]
extras = dev
commands = pytest -v -n auto --reruns 1 --reruns-delay 10 --log-level DEBUG {posargs}

[flake8]
max-line-length = 100
# The Instagram user agent and the upstream error message constants are single long strings
extend-ignore = E501
